# esp32-01 só pode publicar no seu próprio tópico
user esp32-01
topic write sensors/esp32-01/data

# simulador de dispositivos: publica como se fossem vários ESP32
user simulator
topic write sensors/sim/+/data

# o consumidor só pode ler os tópicos de sensores
user subscriber
topic read sensors/#

# agente malicioso de laboratório: ACL deliberadamente ampla, simulando um
# cliente comprometido com acesso total ao broker (leitura e escrita em
# qualquer tópico de sensor). O objetivo é demonstrar que isso NÃO basta
# para forjar dados sem a chave HMAC - nunca replique essa ACL fora do lab.
user attacker
topic readwrite sensors/#
